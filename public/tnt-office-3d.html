<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TNT AI Office · 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Văn phòng 3D (Three.js, nạp từ /vendor/three) chạy bằng dữ liệu thật từ /api/office/state. Khung 3D sáng, phần danh sách tối cho khớp dashboard. Máy không có WebGL → chuyển sang bản 2D tnt-office-live.html. */
:root{
  --bg:#0b1020; --panel:#121a30; --line:#24304d; --ink:#e9edf7; --muted:#8e9bb8;
  --accent:#ffb547; --ok:#3ed6b5; --warn:#ffb547; --bad:#ff6b7d;
  --f-display:"Unbounded","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body)}
.wrap{max-width:1440px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{font:700 26px/1.05 var(--f-display);letter-spacing:.02em;margin:0}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px}
.spacer{flex:1}
.badge{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.badge.live i{background:var(--ok);box-shadow:0 0 0 0 rgba(62,214,181,.6);animation:pulse 1.8s infinite}
.badge.err i{background:var(--bad)}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(62,214,181,0)}100%{box-shadow:0 0 0 0 rgba(62,214,181,0)}}
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
@media (max-width:1240px){.main{grid-template-columns:1fr}}
.stage{position:relative;background:linear-gradient(180deg,#e6edf6 0%,#cfdbe9 100%);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
#gl{position:relative;width:100%;height:clamp(460px,62vw,720px);touch-action:none}
#gl canvas{display:block;width:100%;height:100%}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;will-change:transform;white-space:nowrap}
.room-pill{font:700 9.5px/1 var(--f-display);letter-spacing:.04em;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.92);color:#1b2540;box-shadow:0 2px 10px rgba(20,30,60,.18);border:2px solid var(--c,#5ab8ff)}
.atag{pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.atag .nm{font:600 10.5px/1 var(--f-body);color:#fff;background:rgba(18,26,48,.82);padding:3px 7px;border-radius:999px;border:1.5px solid var(--c,#5ab8ff)}
.atag.sel .nm{background:var(--c,#5ab8ff);color:#0b1020}
.atag .bb{font:500 10.5px/1 var(--f-body);padding:3px 7px;border-radius:8px;background:#fff;color:#141a2e;box-shadow:0 2px 8px rgba(20,30,60,.2)}
.atag .bb.work{background:#e4fff8}.atag .bb.wait,.atag .bb.stuck{background:#fff3dc}.atag .bb.bad{background:#ffe3e6}.atag .bb.off{background:#e8ecf3;color:#5b6682}
.atag .bb:empty{display:none}
.atag .sd{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:var(--sc,#7aa7ff);vertical-align:1px}
.hud{position:absolute;left:12px;top:12px;display:flex;gap:14px;align-items:flex-end;padding:10px 14px;border-radius:12px;background:rgba(18,26,48,.78);backdrop-filter:blur(6px);color:#fff;pointer-events:none}
.hud div{display:flex;flex-direction:column}
.hud b{font:700 26px/1 var(--f-display)}
.hud small{font-size:11px;color:#b9c4dd;margin-top:2px}
.hint{position:absolute;right:12px;bottom:10px;font-size:11px;color:#5b6682;background:rgba(255,255,255,.7);padding:3px 8px;border-radius:999px;pointer-events:none}
.card{position:absolute;left:12px;top:86px;max-width:min(340px,calc(100% - 24px));background:rgba(14,20,38,.95);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:12.5px;backdrop-filter:blur(6px);z-index:3}
.card h3{margin:0 0 2px;font:700 14px/1.3 var(--f-display)}
.card .k{color:var(--muted)}
.card ul{margin:6px 0 0;padding-left:16px}
.card .x{position:absolute;right:8px;top:6px;background:none;border:0;color:var(--muted);font-size:16px;padding:2px 6px;cursor:pointer}
.log{font:12px/1.55 var(--f-mono);color:var(--muted);padding:10px 12px;border-top:1px solid var(--line);min-height:96px;display:flex;flex-direction:column-reverse;gap:1px;background:var(--panel)}
.log div:first-child{color:var(--ink)}
aside{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
aside h2{margin:0;padding:12px 14px;font:700 12px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.stats{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.chip{font-size:11.5px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--muted)}
.chip.ok{color:var(--ok);border-color:rgba(62,214,181,.35)}
.chip.warn{color:var(--warn);border-color:rgba(255,181,71,.35)}
.chip.bad{color:var(--bad);border-color:rgba(255,107,125,.35)}
.chip.stuck{color:#d9a45a;border-color:rgba(255,181,71,.3);border-style:dashed}
.inbox{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 14px;padding:10px 12px;border:1px solid rgba(255,181,71,.4);background:rgba(255,181,71,.08);border-radius:10px;font-size:12.5px}
.inbox a{color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap}
.inbox[hidden]{display:none}
#list{max-height:520px;overflow:auto}
.row{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:start;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover,.row.sel{background:#17213c}
.dot{width:10px;height:10px;border-radius:50%;margin-top:5px}
.row .n{font-weight:600}
.row .m{font-size:11.5px;color:var(--muted)}
.row .r{font:600 11px var(--f-mono);text-align:right;white-space:nowrap;color:var(--muted)}
.st{display:inline-block;border-radius:6px;padding:1px 7px;font:600 11px var(--f-body)}
.st.work{background:rgba(62,214,181,.16);color:var(--ok)}
.st.idle{background:#1b2542;color:var(--muted)}
.st.wait{background:rgba(255,181,71,.14);color:var(--warn)}
.st.bad{background:rgba(255,107,125,.16);color:var(--bad)}
.st.stuck{background:rgba(255,181,71,.10);color:#d9a45a;border:1px dashed rgba(255,181,71,.45)}
.st.off{background:#161d34;color:#6f7b98}
.empty{padding:18px 14px;color:var(--muted);font-size:13px}
.foot{padding:10px 14px;font-size:11.5px;color:var(--muted)}
.foot a{color:var(--muted)}
button:focus-visible,.row:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div class="wrap">
  <header>
    <div>
      <h1>TNT <span>AI</span> OFFICE</h1>
      <div class="sub" id="subtitle">Đang tải dữ liệu…</div>
    </div>
    <span class="badge" id="badge"><i></i><span id="badgeText">Đang kết nối</span></span>
    <div class="spacer"></div>
  </header>

  <div class="main">
    <section class="stage" aria-label="Văn phòng AI 3D">
      <div id="gl" role="img" aria-label="Văn phòng 3D với các nhân sự AI, trạng thái cập nhật trực tiếp"></div>
      <div id="labels"></div>
      <div class="hud" id="hud"></div>
      <div class="hint">Kéo để xoay · cuộn để phóng to · bấm vào nhân sự để xem</div>
      <div class="card" id="card" hidden></div>
      <div class="log" id="log" aria-live="polite"></div>
    </section>

    <aside>
      <h2>Nhân sự AI</h2>
      <div class="stats" id="stats"></div>
      <div class="inbox" id="inbox" hidden><span id="inboxText"></span><a href="/dashboard" target="_top">Mở mục Chờ duyệt →</a></div>
      <div id="list"></div>
      <div class="foot">Dữ liệu lấy trực tiếp từ hệ thống, tự cập nhật mỗi 10 giây khi tab đang mở. Nội dung việc chỉ hiện khi bạn bấm vào từng nhân sự. · <a href="/tnt-office-live.html">Bản 2D</a> · <a href="/tnt-office.html">Bản mô phỏng cũ</a></div>
    </aside>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/OrbitControls.js';

/* ---------- WebGL có chạy được không? Không thì dùng bản 2D ---------- */
const glHost=document.getElementById('gl');
let renderer;
try{
  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
}catch(e){ location.replace('/tnt-office-live.html'); throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFShadowMap;
glHost.appendChild(renderer.domElement);

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const PAL=['#5ab8ff','#ff9fb8','#4fe0b0','#b59cff','#ffc65c','#ff9f6b','#6be3ff','#c3e66b'];
const EXEC_COLOR='#ffc65c';
const POLL_MS=10000;
const STATE_HEX={work:0x2de2c0,wait:0xffb547,bad:0xff5a6e,stuck:0xd9a45a,idle:0x7aa7ff,off:0x8e9bb8};

/* ---------- Tiện ích ---------- */
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const hmsNow=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())};
const hmNow=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
function ago(iso){
  if(!iso)return '—';
  const m=Math.round((Date.now()-new Date(iso).getTime())/60000);
  if(m<1)return 'vừa xong';
  if(m<60)return m+' phút trước';
  const h=Math.floor(m/60);
  if(h<24)return h+' giờ trước';
  return Math.floor(h/24)+' ngày trước';
}
function mixHex(a,b,t){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const c=sh=>Math.round(((pa>>sh)&255)*t+((pb>>sh)&255)*(1-t));return'#'+[16,8,0].map(sh=>c(sh).toString(16).padStart(2,'0')).join('')}
function shortName(n){const s=String(n||'');return s.length>16?s.slice(0,15)+'…':s}

/* ---------- Trạng thái ---------- */
function viewState(a){
  switch(a.status){
    // 'running' mà không có việc đang chạy thật (API gắn stuck_running) → có thể kẹt
    case 'running': return a.stuck_running?'stuck':'work';
    case 'approval_required': return 'wait';
    case 'error': case 'warning': return 'bad';
    case 'offline': return 'off';
    default: return 'idle';
  }
}
const LABEL={stuck:'Có thể kẹt',work:'Đang làm',wait:'Chờ duyệt',bad:'Lỗi',off:'Offline',idle:'Rảnh'};
const BUBBLE={stuck:'Trạng thái kẹt? Cần kiểm tra',work:'Đang xử lý việc…',wait:'Chờ anh duyệt',bad:'Gặp lỗi, cần kiểm tra',off:'z z z'};

/* ---------- Cảnh 3D ---------- */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xd5e0ee);
const camera=new THREE.PerspectiveCamera(28,1,.5,400);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.08;
controls.minPolarAngle=.45;controls.maxPolarAngle=1.25;
controls.minAzimuthAngle=-.3;controls.maxAzimuthAngle=1.9;
controls.screenSpacePanning=true;

scene.add(new THREE.HemisphereLight(0xffffff,0xb7c4d4,1.05));
scene.add(new THREE.AmbientLight(0xffffff,.25));
const sun=new THREE.DirectionalLight(0xffffff,1.55);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;
scene.add(sun);scene.add(sun.target);

const MAT={};
const mat=(key,color,o={})=>MAT[key]||(MAT[key]=new THREE.MeshStandardMaterial(Object.assign({color,roughness:.85,metalness:0},o)));
const geoCache=new Map();
const boxGeo=(w,h,d)=>{const k=w+'|'+h+'|'+d;let g=geoCache.get(k);if(!g){g=new THREE.BoxGeometry(w,h,d);geoCache.set(k,g)}return g};
function box(parent,w,h,d,material,x,y,z,shadow=true){
  const m=new THREE.Mesh(boxGeo(w,h,d),material);m.position.set(x,y,z);
  if(shadow){m.castShadow=true;m.receiveShadow=true}
  parent.add(m);return m;
}
const sphereGeo=new THREE.SphereGeometry(1,20,14);
const cylGeo=new THREE.CylinderGeometry(1,1,1,20);
const capGeo=new THREE.CapsuleGeometry(1,1,6,14);
function sph(parent,r,material,x,y,z,sx=1,sy=1,sz=1,shadow=true){const m=new THREE.Mesh(sphereGeo,material);m.scale.set(r*sx,r*sy,r*sz);m.position.set(x,y,z);m.castShadow=shadow;parent.add(m);return m}
function cyl(parent,r,h,material,x,y,z,shadow=true){const m=new THREE.Mesh(cylGeo,material);m.scale.set(r,h,r);m.position.set(x,y,z);m.castShadow=shadow;m.receiveShadow=true;parent.add(m);return m}

let world=null;                 // nhóm chứa toàn bộ cảnh được dựng từ dữ liệu
let rooms=[], agents=[], byId=new Map(), tasksByAgent=new Map(), data=null, selected=null;
let walkers=[], hitMeshes=[], bounds={cx:0,cz:0,R:10};
const labelsEl=document.getElementById('labels');
let roomLabels=[], agentLabels=[];

function makeFigure(color,seated){
  const g=new THREE.Group();
  const bodyMat=new THREE.MeshStandardMaterial({color,roughness:.8});
  const torso=new THREE.Mesh(capGeo,bodyMat);torso.scale.set(.17,.3,.14);torso.position.y=seated?.32:.95;torso.castShadow=true;g.add(torso);
  const head=new THREE.Group();head.position.y=seated?.78:1.42;g.add(head);
  sph(head,.14,mat('skin',0xf0cfb5),0,0,0);
  sph(head,.152,mat('hair',0x2a2230),0,.035,.015,1,.82,1);
  const eyeM=mat('eye',0x1a1a24);
  sph(head,.018,eyeM,-.05,0,-.13,1,1.4,.6,false);sph(head,.018,eyeM,.05,0,-.13,1,1.4,.6,false);
  const arms=[];
  for(const s of [-1,1]){
    const p=new THREE.Group();p.position.set(s*.2,seated?.5:1.15,0);
    const a=new THREE.Mesh(boxGeo(.075,.075,.38),bodyMat);a.position.set(0,0,-.19);a.castShadow=true;p.add(a);
    g.add(p);arms.push(p);
  }
  let legs=[];
  if(seated){
    for(const s of [-1,1])box(g,.11,.11,.46,mat('pants',0x33405c),s*.09,.08,-.2);
  }else{
    for(const s of [-1,1]){const p=new THREE.Group();p.position.set(s*.09,.62,0);box(p,.11,.62,.12,mat('pants',0x33405c),0,-.31,0);g.add(p);legs.push(p)}
  }
  g.userData={head,arms,legs,torso};
  return g;
}

function makeChair(parent,x,z){
  const g=new THREE.Group();g.position.set(x,0,z);
  const m=mat('chair',0x56789f);
  box(g,.5,.07,.5,m,0,.45,0);
  box(g,.5,.5,.06,m,0,.74,.25);
  cyl(g,.035,.4,mat('chrome',0x9aa5b4),0,.23,0);
  cyl(g,.22,.03,mat('chrome',0x9aa5b4),0,.03,0);
  parent.add(g);
}
function makePlant(parent,x,z,s=1){
  const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);
  cyl(g,.26,.4,mat('pot',0xb98a62),0,.2,0);
  const leaf=mat('leaf',0x4aa66b),leaf2=mat('leaf2',0x62bd7f);
  sph(g,.3,leaf,0,.7,0);sph(g,.22,leaf2,.18,.95,.05);sph(g,.2,leaf,-.15,1.0,-.05);
  parent.add(g);
}
function makeServerRack(parent,x,z){
  const g=new THREE.Group();g.position.set(x,0,z);
  box(g,.7,1.8,.8,mat('rack',0x2b3442),0,.9,0);
  for(let i=0;i<6;i++){box(g,.6,.04,.02,mat('rackLed'+(i%2),i%2?0x2de2c0:0x7aa7ff,{emissive:i%2?0x2de2c0:0x7aa7ff,emissiveIntensity:.9}),0,.3+i*.26,.41,false)}
  parent.add(g);
}
function makeBookshelf(parent,x,z,rotY){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rotY||0;
  box(g,1.8,1.7,.4,mat('shelf',0xc9a779),0,.85,0);
  const cols=[0xd9534f,0x4f7fd9,0xe6b84f,0x58b38a,0x9b6fd1];
  for(let r=0;r<3;r++)for(let i=0;i<9;i++){
    box(g,.12,.34,.28,mat('bk'+((i+r)%5),cols[(i+r)%5]),-.76+i*.19,.38+r*.5,.02,false);
  }
  parent.add(g);
}

function disposeWorld(){
  if(!world)return;
  scene.remove(world);
  world.traverse(o=>{if(o.isMesh&&o.userData.ownGeo){o.geometry.dispose()}});
  roomLabels.forEach(l=>l.el.remove());agentLabels.forEach(l=>l.el.remove());
  roomLabels=[];agentLabels=[];walkers=[];hitMeshes=[];
}

function label(cls,html,color){
  const el=document.createElement('div');el.className='lbl '+cls;if(color)el.style.setProperty('--c',color);el.innerHTML=html;labelsEl.appendChild(el);return el;
}

function build3D(){
  disposeWorld();
  world=new THREE.Group();scene.add(world);

  // --- phân nhóm phòng ---
  const groups=[];
  const exec=agents.filter(a=>!a.department_id);
  if(exec.length)groups.push({id:'__exec',name:'BAN ĐIỀU HÀNH',color:EXEC_COLOR,agents:exec});
  (data.departments||[]).forEach((d,i)=>{
    const list=agents.filter(a=>a.department_id===d.id);
    if(list.length)groups.push({id:d.id,name:String(d.name).toUpperCase(),color:PAL[i%PAL.length],agents:list});
  });
  const COLS=Math.min(3,Math.max(1,groups.length)), RW=6, GAP=1.5;
  const rowH=[];
  groups.forEach((g,i)=>{
    const rows=Math.ceil(g.agents.length/2);
    g.hh=Math.max(4.8,1.4+(rows-1)*2.1+2.1);
    const r=Math.floor(i/COLS);rowH[r]=Math.max(rowH[r]||0,g.hh);
  });
  let zc=0;const rowZ=rowH.map(h=>{const v=zc;zc+=h+GAP;return v});
  const totalD=Math.max(0,zc-GAP);
  const totalW=COLS*RW+(COLS-1)*GAP;
  groups.forEach((g,i)=>{
    const c=i%COLS,r=Math.floor(i/COLS);
    g.x=c*(RW+GAP);g.z=rowZ[r];g.w=RW;g.d=rowH[r];
    g.agents.forEach((a,k)=>{
      const col=k%2,row=Math.floor(k/2);
      a.dx=g.x+1.5+col*2.9;a.dz=g.z+1.5+row*2.1;
      a.color=g.color;a.room=g;
    });
  });
  rooms=groups;
  bounds={cx:totalW/2,cz:totalD/2,R:Math.hypot(totalW,totalD)/2+2,W:totalW,D:totalD};

  // --- nền, sảnh ---
  const slab1=box(world,totalW+4.4,.5,totalD+8.6,mat('slab1',0xdde5ee),bounds.cx,-.55,bounds.cz+2.4);
  const slab2=box(world,totalW+2.6,.3,totalD+6.8,mat('slab2',0xf5f8fb),bounds.cx,-.15,bounds.cz+2.4);
  slab1.castShadow=false;slab2.castShadow=false;
  // viền sáng quanh sảnh
  box(world,totalW+2.6,.05,.12,mat('trim',0x9db4cc),bounds.cx,.02,totalD+5.6,false);

  // --- phòng ---
  for(const r of rooms){
    const floor=mat('floor'+r.id,mixHex(r.color,'#86bdb5',.16));
    box(world,r.w,.08,r.d,floor,r.x+r.w/2,.04,r.z+r.d/2).castShadow=false;
    const wallM=mat('wall',0xf1f4f8), trimM=mat('trim'+r.id,r.color);
    const H=1.25,T=.14,door=1.7;
    // vách sau (chừa cửa giữa) và vách trái
    const half=(r.w-door)/2;
    box(world,half,H,T,wallM,r.x+half/2,H/2,r.z);
    box(world,half,H,T,wallM,r.x+r.w-half/2,H/2,r.z);
    box(world,half,.06,T+.02,trimM,r.x+half/2,H+.03,r.z,false);
    box(world,half,.06,T+.02,trimM,r.x+r.w-half/2,H+.03,r.z,false);
    box(world,T,H,r.d,wallM,r.x,H/2,r.z+r.d/2);
    box(world,T+.02,.06,r.d,trimM,r.x,H+.03,r.z+r.d/2,false);
    // vách phải thấp để ngăn phòng
    box(world,T,.5,r.d,wallM,r.x+r.w,.25,r.z+r.d/2);
    // nhãn phòng
    const el=label('room-pill',esc(r.name),r.color);
    roomLabels.push({el,pos:new THREE.Vector3(r.x+r.w/2,3.0,r.z)});
  }
  // đồ trang trí cố định theo chỉ số phòng
  rooms.forEach((r,i)=>{
    makePlant(world,r.x+r.w-.5,r.z+r.d-.5);
    if(i%3===1)makeServerRack(world,r.x+.6,r.z+.7);
    if(i%3===2)makeBookshelf(world,r.x+r.w-1.2,r.z+.35,0);
    if(i%3===0)makePlant(world,r.x+.5,r.z+r.d-.5,.85);
  });
  // cây ở hành lang
  for(let x=1;x<totalW;x+=4.5)makePlant(world,x,totalD+1.1,.8);

  // --- bàn, ghế, nhân sự ---
  for(const a of agents){
    const g=new THREE.Group();g.position.set(a.dx,0,a.dz);world.add(g);
    // bàn
    box(g,1.7,.06,.85,mat('desk',0xd9b88c),0,.76,0);
    box(g,.06,.74,.8,mat('deskLeg',0xc9a579),-.8,.37,0);
    box(g,.06,.74,.8,mat('deskLeg',0xc9a579),.8,.37,0);
    box(g,1.6,.4,.04,mat('deskLeg',0xc9a579),0,.55,-.38);
    // màn hình (mặt sáng hướng +z, về phía nhân sự)
    box(g,.3,.02,.2,mat('dark',0x2b3442),0,.8,-.2);
    box(g,.05,.26,.05,mat('dark',0x2b3442),0,.93,-.2);
    box(g,.78,.46,.04,mat('dark',0x2b3442),0,1.2,-.2);
    const screenMat=new THREE.MeshStandardMaterial({color:0x10213a,emissive:0x2a4a7a,emissiveIntensity:.5,roughness:.4});
    const screen=new THREE.Mesh(new THREE.PlaneGeometry(.7,.38),screenMat);screen.userData.ownGeo=true;screen.position.set(0,1.2,-.176);screen.rotation.y=0;g.add(screen);
    // đèn trạng thái trên đỉnh màn hình
    const ledMat=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x7aa7ff,emissiveIntensity:1.4});
    const led=new THREE.Mesh(sphereGeo,ledMat);led.scale.setScalar(.055);led.position.set(0,1.5,-.2);g.add(led);
    // bàn phím, chuột
    box(g,.46,.025,.16,mat('kb',0xdfe5ec),0,.805,.1,false);
    // vệt sáng trên mặt bàn
    const glowMat=new THREE.MeshBasicMaterial({color:0x7aa7ff,transparent:true,opacity:.0,depthWrite:false});
    const glow=new THREE.Mesh(new THREE.PlaneGeometry(1.5,.7),glowMat);glow.userData.ownGeo=true;glow.rotation.x=-Math.PI/2;glow.position.set(0,.795,0);g.add(glow);
    // vòng sáng dưới sàn
    const ringMat=new THREE.MeshBasicMaterial({color:0x7aa7ff,transparent:true,opacity:.5,depthWrite:false,side:THREE.DoubleSide});
    const ring=new THREE.Mesh(new THREE.RingGeometry(1.15,1.28,64),ringMat);ring.userData.ownGeo=true;ring.rotation.x=-Math.PI/2;ring.position.set(0,.1,.25);g.add(ring);
    // ghế + nhân sự (ngồi quay mặt về -z, hướng tới màn hình)
    makeChair(g,0,.95);
    const fig=makeFigure(new THREE.Color(a.color),true);fig.position.set(0,.45,.95);g.add(fig);
    // vùng bấm
    const hit=new THREE.Mesh(boxGeo(1.9,1.9,1.9),new THREE.MeshBasicMaterial({visible:false}));hit.position.set(0,.95,.4);hit.userData.agentId=a.id;g.add(hit);hitMeshes.push(hit);
    a.parts={screenMat,ledMat,glowMat,ringMat,fig,phase:Math.random()*6.28};
    // nhãn
    const el=label('atag','<div class="bb"></div><div class="nm"><i class="sd"></i>'+esc(shortName(a.name))+'</div>',a.color);
    el.style.pointerEvents='auto';
    el.addEventListener('click',()=>showCard(byId.get(a.id)));
    agentLabels.push({el,agent:a,pos:new THREE.Vector3(a.dx,1.95,a.dz+.8)});
  }

  // --- sảnh: bảng hiệu + người đi lại ---
  const cv=document.createElement('canvas');cv.width=1024;cv.height=256;
  const c2=cv.getContext('2d');c2.fillStyle='#1b2a4a';c2.fillRect(0,0,1024,256);
  c2.fillStyle='#ffc65c';c2.font='700 74px Unbounded, sans-serif';c2.textAlign='center';c2.textBaseline='middle';c2.fillText('TNT CORPORATION',512,100);
  c2.fillStyle='#cfe0ff';c2.font='500 40px "Be Vietnam Pro", sans-serif';c2.fillText('AI OFFICE',512,190);
  const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=4;
  const signM=new THREE.MeshStandardMaterial({map:tex,roughness:.6});
  const sign=new THREE.Mesh(new THREE.BoxGeometry(5,1.25,.2),[mat('dark',0x2b3442),mat('dark',0x2b3442),mat('dark',0x2b3442),mat('dark',0x2b3442),signM,mat('dark',0x2b3442)]);
  sign.userData.ownGeo=true;sign.position.set(bounds.cx,1.4,totalD+3.6);sign.castShadow=true;world.add(sign);
  box(world,.12,.8,.12,mat('dark',0x2b3442),bounds.cx-2,.4,totalD+3.6);
  box(world,.12,.8,.12,mat('dark',0x2b3442),bounds.cx+2,.4,totalD+3.6);
  const pcol=[0x3a4a6a,0x6a4a5a,0x2f5d52];
  for(let i=0;i<3;i++){
    const w=makeFigure(new THREE.Color(pcol[i]),false);w.userData.speed=.55+i*.18;w.userData.z=totalD+1.9+i*.55;w.userData.span=[1.5,totalW-1.5];w.userData.t0=i*3.1;
    world.add(w);walkers.push(w);
  }

  // --- ánh sáng + camera theo kích thước cảnh ---
  const R=bounds.R;
  sun.position.set(bounds.cx+R*1.1,R*1.8,bounds.cz+R*.8);sun.target.position.set(bounds.cx,0,bounds.cz);
  const sc=sun.shadow.camera;sc.left=-R-5;sc.right=R+5;sc.top=R+5;sc.bottom=-R-5;sc.near=1;sc.far=R*6;sc.updateProjectionMatrix();
  fitCamera(true);
}

function fitCamera(reset){
  const w=glHost.clientWidth||800,h=glHost.clientHeight||520;
  camera.aspect=w/h;
  const fov=camera.fov*Math.PI/180;
  const halfW=bounds.W/2+1.5,halfD=bounds.D/2+2.5;
  const radius=Math.hypot(halfW,halfD)*.66;
  const dist=Math.max(radius/Math.tan(fov/2),radius/(Math.tan(fov/2)*camera.aspect));
  camera.updateProjectionMatrix();
  controls.minDistance=dist*.35;controls.maxDistance=dist*1.5;
  if(reset){
    const polar=1.0,az=Math.PI/4;
    controls.target.set(bounds.cx,.4,bounds.cz+.8);
    camera.position.set(
      controls.target.x+dist*Math.sin(polar)*Math.sin(az),
      controls.target.y+dist*Math.cos(polar),
      controls.target.z+dist*Math.sin(polar)*Math.cos(az));
    controls.update();
  }
}
function resize(){
  const w=glHost.clientWidth,h=glHost.clientHeight;if(!w||!h)return;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.updateProjectionMatrix();
}
new ResizeObserver(()=>{resize();if(world)fitCamera(false)}).observe(glHost);

/* ---------- Cập nhật hiển thị theo trạng thái ---------- */
function applyStates(){
  for(const a of agents){
    if(!a.parts)continue;
    const st=viewState(a),hex=STATE_HEX[st];
    a.parts.ledMat.emissive.setHex(hex);a.parts.ledMat.emissiveIntensity=st==='off'?.2:1.4;
    a.parts.ringMat.color.setHex(hex);
    a.parts.glowMat.color.setHex(hex);
    const lit=st==='work'||st==='wait'||st==='bad';
    a.parts.screenMat.emissive.setHex(st==='work'?0x2de2c0:st==='wait'?0xffb547:st==='bad'?0xff5a6e:st==='off'?0x000000:0x2a4a7a);
    a.parts.screenMat.emissiveIntensity=st==='work'?1.0:lit?.8:st==='off'?0:.45;
    a.parts.glowMat.opacity=st==='work'?.28:lit?.2:0;
  }
  for(const l of agentLabels){
    const st=viewState(l.agent),bb=l.el.querySelector('.bb');
    bb.className='bb '+st;bb.textContent=st==='idle'?'':(st==='stuck'?'Kẹt?':LABEL[st]);
    l.el.style.setProperty('--sc','#'+STATE_HEX[st].toString(16).padStart(6,'0'));
    l.el.classList.toggle('sel',selected===l.agent);
  }
  const working=agents.filter(a=>viewState(a)==='work').length;
  document.getElementById('hud').innerHTML=
    `<div><b>${agents.length}</b><small>agent AI</small></div><div><b>${rooms.length}</b><small>phòng ban</small></div><div><b style="color:#5ef2d0">${working}</b><small>đang làm</small></div>`;
}

/* ---------- Vòng lặp vẽ ---------- */
const t0=performance.now();
const tmp=new THREE.Vector3();
function frame(){
  requestAnimationFrame(frame);
  if(!world){return}
  const t=(performance.now()-t0)/1000;
  for(const a of agents){
    const p=a.parts;if(!p)continue;
    const st=viewState(a),f=p.fig,u=f.userData;
    if(st==='work'&&!reduce){
      u.arms[0].rotation.x=.42+Math.sin(t*14+p.phase)*.09;
      u.arms[1].rotation.x=.42+Math.sin(t*14+p.phase+1.7)*.09;
      u.head.rotation.x=.12+Math.sin(t*2+p.phase)*.04;u.head.rotation.y=0;
      p.ringMat.opacity=.5+.3*Math.sin(t*3+p.phase);
    }else{
      u.arms[0].rotation.x=u.arms[1].rotation.x=.25;
      u.head.rotation.x=0;
      u.head.rotation.y=reduce?0:Math.sin(t*.6+p.phase)*.35;
      p.ringMat.opacity=st==='bad'?(.3+.4*(Math.sin(t*6)>0?1:0)):st==='wait'?.55+.25*Math.sin(t*2.5):st==='off'?.12:.32;
    }
    if(selected===a)p.ringMat.opacity=.95;
  }
  for(const w of walkers){
    const [x0,x1]=w.userData.span,L=x1-x0;
    const s=((t+w.userData.t0)*w.userData.speed)%(2*L);
    const x=s<L?x0+s:x1-(s-L);
    w.position.set(x,0,w.userData.z);w.rotation.y=s<L?-Math.PI/2:Math.PI/2;
    const sw=Math.sin(t*6+w.userData.t0)*.5;
    if(w.userData.legs[0]){w.userData.legs[0].rotation.x=sw;w.userData.legs[1].rotation.x=-sw}
    w.userData.arms[0].rotation.x=-sw*.6;w.userData.arms[1].rotation.x=sw*.6;
  }
  controls.update();
  renderer.render(scene,camera);
  // nhãn HTML bám theo vị trí 3D
  const W=glHost.clientWidth,H=glHost.clientHeight;
  const place=(el,pos)=>{
    tmp.copy(pos).project(camera);
    if(tmp.z>1){el.style.display='none';return}
    el.style.display='';
    el.style.transform=`translate(${((tmp.x*.5+.5)*W).toFixed(1)}px,${((-tmp.y*.5+.5)*H).toFixed(1)}px) translate(-50%,-100%)`;
  };
  for(const l of roomLabels)place(l.el,l.pos);
  for(const l of agentLabels)place(l.el,l.pos);
}

/* ---------- Chọn nhân sự bằng cách bấm vào mô hình 3D ---------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
let downXY=null;
renderer.domElement.addEventListener('pointerdown',e=>{downXY=[e.clientX,e.clientY]});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downXY||Math.hypot(e.clientX-downXY[0],e.clientY-downXY[1])>4)return;
  const r=renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects(hitMeshes,false)[0];
  showCard(hit?byId.get(hit.object.userData.agentId):null);
});

/* ---------- Giao diện (dùng chung logic với bản 2D) ---------- */
const logEl=document.getElementById('log'),logs=[];
function log(s){logs.unshift(s);if(logs.length>6)logs.pop();logEl.innerHTML=logs.map(x=>`<div>${esc(x)}</div>`).join('')}
const card=document.getElementById('card'),listEl=document.getElementById('list'),statsEl=document.getElementById('stats');
const badge=document.getElementById('badge'),badgeText=document.getElementById('badgeText'),subtitle=document.getElementById('subtitle');
const inbox=document.getElementById('inbox'),inboxText=document.getElementById('inboxText');
function setBadge(kind,text){badge.className='badge '+kind;badgeText.textContent=text}
function showCard(a){
  selected=a||null;
  if(!a){card.hidden=true;renderList();applyStates();return}
  const st=viewState(a),ts=(tasksByAgent.get(a.id)||[]).slice(0,3);
  card.hidden=false;
  card.innerHTML=`<button class="x" type="button" aria-label="Đóng">×</button><h3 style="color:${a.color}">${esc(a.name)}</h3><div class="k">${esc(a.role||'')}</div>`+
   `<p style="margin:8px 0 2px"><span class="k">Trạng thái:</span> ${LABEL[st]}<br><span class="k">Cấp:</span> ${esc(a.level||'—')}${a.approval_level?` · <span class="k">Cần duyệt cấp</span> ${a.approval_level}`:''}<br><span class="k">Xong việc gần nhất:</span> ${esc(ago(a.last_task_completed_at))}</p>`+
   (ts.length?`<div class="k" style="margin-top:6px">Việc gần đây</div><ul>${ts.map(t=>`<li>${esc(t.input||'(không có nội dung)')} <span class="k">· ${esc(t.status)}${t.delegated?' · được giao lại':''}</span></li>`).join('')}</ul>`:'<div class="k" style="margin-top:6px">Chưa có việc gần đây.</div>');
  card.querySelector('.x').onclick=()=>showCard(null);
  renderList();applyStates();
}
const ORDER={work:0,wait:1,bad:2,stuck:3,idle:4,off:5};
function renderList(){
  const c={work:0,wait:0,bad:0,stuck:0};
  agents.forEach(a=>{const s=viewState(a);if(c[s]!==undefined)c[s]++});
  statsEl.innerHTML=`<span class="chip">${agents.length} nhân sự AI</span>`+
    (c.work?`<span class="chip ok">● ${c.work} đang làm</span>`:'')+
    (c.wait?`<span class="chip warn">${c.wait} chờ duyệt</span>`:'')+
    (c.bad?`<span class="chip bad">${c.bad} lỗi</span>`:'')+
    (c.stuck?`<span class="chip stuck" title="Trạng thái 'running' trong database nhưng không có việc nào đang chạy">${c.stuck} có thể kẹt</span>`:'');
  const pend=data?.pending_approvals||0;
  inbox.hidden=!pend;
  inboxText.textContent=pend?`${pend} việc đang chờ bạn duyệt`:'';
  if(!agents.length){listEl.innerHTML='<div class="empty">Chưa có nhân sự AI nào trong công ty con này.</div>';return}
  const rows=[...agents].sort((a,b)=>ORDER[viewState(a)]-ORDER[viewState(b)]||String(a.name).localeCompare(String(b.name),'vi'));
  listEl.innerHTML=rows.map(a=>{const s=viewState(a);
    return `<div class="row${selected===a?' sel':''}" tabindex="0" data-id="${esc(a.id)}"><span class="dot" style="background:${a.color}"></span><div><div class="n">${esc(a.name)} <span class="st ${s}">${LABEL[s]}</span></div><div class="m">${esc(a.role||'')}</div></div><div class="r">${esc(ago(a.last_task_completed_at))}</div></div>`}).join('');
}
listEl.addEventListener('click',e=>{const r=e.target.closest('.row');if(r)showCard(byId.get(r.dataset.id))});
listEl.addEventListener('keydown',e=>{if(e.key==='Enter'){const r=e.target.closest('.row');if(r)showCard(byId.get(r.dataset.id))}});

/* ---------- Lấy dữ liệu ---------- */
const prevStatus=new Map();
let firstLoad=true, layoutKey='';
function apply(json){
  data=json;
  const old=new Map(agents.map(a=>[a.id,a]));
  const fresh=(json.agents||[]).map(a=>Object.assign(old.get(a.id)||{},a));
  const key=fresh.map(a=>a.id+':'+a.department_id).join('|')+'#'+(json.departments||[]).map(d=>d.id).join('|');
  agents=fresh;byId=new Map(agents.map(a=>[a.id,a]));
  if(key!==layoutKey){build3D();layoutKey=key}
  tasksByAgent=new Map();
  for(const t of json.recent_tasks||[]){if(!tasksByAgent.has(t.agent_id))tasksByAgent.set(t.agent_id,[]);tasksByAgent.get(t.agent_id).push(t)}
  for(const a of agents){
    const p=prevStatus.get(a.id);
    if(!firstLoad&&p!==undefined&&p!==a.status){
      const s=viewState(a);
      const msg=s==='work'?'bắt đầu xử lý việc':s==='wait'?'đang chờ duyệt':s==='bad'?'gặp lỗi':p==='running'?'xong việc':'đổi trạng thái → '+a.status;
      log(`${hmNow()} · ${shortName(a.name)}: ${msg}`);
    }
    prevStatus.set(a.id,a.status);
  }
  if(firstLoad)log(`${hmNow()} · Đã kết nối, ${agents.length} nhân sự AI`);
  firstLoad=false;
  subtitle.textContent=`Văn phòng ${json.business_unit?.name||''} · dữ liệu thật từ hệ thống`;
  setBadge('live','TRỰC TIẾP · '+hmsNow());
  if(selected)selected=byId.get(selected.id)||null;
  if(selected)showCard(selected);else{renderList();applyStates()}
}
async function poll(){
  if(document.hidden)return;
  try{
    const res=await fetch('/api/office/state',{credentials:'same-origin',cache:'no-store'});
    if(res.status===401){setBadge('err','Cần đăng nhập');subtitle.innerHTML='Phiên đăng nhập đã hết. <a href="/login" target="_top" style="color:var(--accent)">Đăng nhập lại</a>';return}
    const json=await res.json().catch(()=>null);
    if(!res.ok||!json){setBadge('err','Lỗi dữ liệu');subtitle.textContent=(json&&json.error)||('Không lấy được dữ liệu (HTTP '+res.status+').');return}
    apply(json);
  }catch(e){
    setBadge('err','Mất kết nối');
    if(!data)subtitle.textContent='Không kết nối được tới hệ thống. Thử tải lại trang.';
  }
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
resize();
poll();setInterval(poll,POLL_MS);
requestAnimationFrame(frame);
window.__office3d={scene,camera,controls,get agents(){return agents}};
</script>
