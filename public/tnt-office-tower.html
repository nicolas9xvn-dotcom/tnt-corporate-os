<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TNT AI Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Tòa nhà AI 10 tầng (Three.js, nạp từ /vendor/three): mỗi tầng là một phòng ban, chọn tầng để xem bên trong. Dữ liệu thật từ /api/office/state. Giao diện HUD neon kiểu màn hình cảm ứng; ô thông tin bấm để phóng to. */
:root{
  --bg:#07041a; --ink:#e9e6ff; --muted:#9b94c9; --cy:#29e6ff; --pu:#8b5cff; --or:#ffb347;
  --ok:#2de2c0; --warn:#ffb347; --bad:#ff5a6e;
  --f-display:"Unbounded","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body)}
.wrap{max-width:1600px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-right)) 16px max(12px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:10px;height:100%}
header{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
h1{font:700 22px/1.05 var(--f-display);letter-spacing:.04em;margin:0}
h1 span{color:var(--or)}
.sub{color:var(--muted);font-size:12.5px}
.spacer{flex:1}
.badge{display:inline-flex;align-items:center;gap:7px;font:600 11px var(--f-mono);letter-spacing:.06em;color:var(--muted);border:1px solid rgba(41,230,255,.3);border-radius:999px;padding:3px 10px}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.badge.live i{background:var(--ok);box-shadow:0 0 0 0 rgba(45,226,192,.6);animation:pulse 1.8s infinite}
.badge.err i{background:var(--bad)}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(45,226,192,0)}100%{box-shadow:0 0 0 0 rgba(45,226,192,0)}}

.stage{position:relative;flex:1;min-height:560px;border-radius:10px;overflow:hidden;border:1px solid rgba(41,230,255,.45);box-shadow:0 0 0 1px rgba(139,92,255,.25),0 0 40px rgba(110,60,255,.25),inset 0 0 60px rgba(60,20,160,.35);
  background:radial-gradient(120% 90% at 50% 38%,#2a1166 0%,#150a3a 42%,#07041a 80%)}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0,rgba(255,255,255,.025) 1px,transparent 1px,transparent 3px);mix-blend-mode:screen}
#gl{position:absolute;inset:0;touch-action:none}
#gl canvas{display:block;width:100%;height:100%}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.lbl{position:absolute;left:0;top:0;will-change:transform;white-space:nowrap}
.fpill{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:7px;font:700 10px/1 var(--f-mono);letter-spacing:.08em;padding:6px 10px;border-radius:4px;background:rgba(14,8,48,.82);color:#cfd6ff;border:1px solid var(--c,#29e6ff);box-shadow:0 0 12px color-mix(in srgb,var(--c,#29e6ff) 45%,transparent)}
.fpill b{color:var(--c,#29e6ff)}
.fpill .dots{display:flex;gap:4px;font-weight:700}
.fpill.sel{background:var(--c,#29e6ff);color:#10082a}.fpill.sel b{color:#10082a}
.fpill.empty{opacity:.45}
.fpill.dim{opacity:.3}
.atag{pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.atag .nm{font:600 10.5px/1 var(--f-body);color:#fff;background:rgba(14,8,48,.85);padding:3px 7px;border-radius:999px;border:1.5px solid var(--c,#29e6ff)}
.atag.sel .nm{background:var(--c,#29e6ff);color:#10082a}
.atag .sd{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:var(--sc,#7aa7ff);vertical-align:1px}
.atag .bb{font:500 10.5px/1 var(--f-body);padding:3px 7px;border-radius:6px;background:#fff;color:#141a2e}
.atag .bb.work{background:#d6fff3}.atag .bb.wait,.atag .bb.stuck{background:#fff0d2}.atag .bb.bad{background:#ffdde2}.atag .bb.off{background:#e8ecf3;color:#5b6682}
.atag .bb:empty{display:none}

/* ---- HUD neon ---- */
.panel{position:relative;background:linear-gradient(160deg,rgba(30,14,78,.80),rgba(10,8,40,.82));border:1px solid rgba(41,230,255,.38);border-radius:6px;backdrop-filter:blur(8px);box-shadow:0 0 22px rgba(120,70,255,.28),inset 0 0 18px rgba(41,230,255,.06)}
.panel::before,.panel::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--or);pointer-events:none}
.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;font:700 11px var(--f-mono);letter-spacing:.14em;color:#7ff3ff;cursor:pointer;text-transform:uppercase;border-bottom:1px solid rgba(41,230,255,.18);min-height:40px;user-select:none}
.ph .ex{color:var(--or);font-size:14px}
.pb{padding:10px 12px;font-size:12.5px}
.dock{position:absolute;z-index:3;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.dock>*{pointer-events:auto}
.dock-l{left:12px;top:12px;bottom:12px;width:224px}
.dock-r{right:12px;top:12px;bottom:12px;width:300px;overflow:auto;scrollbar-width:thin}
.fl-list{display:flex;flex-direction:column;gap:5px;overflow:auto;padding:8px;scrollbar-width:thin;flex:1}
.fl{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:6px;min-height:44px;padding:5px 8px;border:1px solid rgba(139,92,255,.4);border-radius:4px;background:rgba(20,10,60,.6);cursor:pointer;color:#cfd6ff;font:600 11px/1.2 var(--f-body)}
.fl .n{font:700 13px var(--f-mono);color:var(--c,#29e6ff)}
.fl .t{font:700 9.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis}
.fl .s{font:700 10px var(--f-mono);display:flex;gap:4px}
.fl:hover{border-color:var(--cy)}
.fl.sel{background:linear-gradient(90deg,rgba(255,179,71,.28),rgba(41,230,255,.12));border-color:var(--or)}
.fl.empty{opacity:.4}
.ok{color:var(--ok)}.wr{color:var(--warn)}.bd{color:var(--bad)}.sk{color:#d9a45a}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border:1px solid rgba(41,230,255,.22);border-radius:4px;padding:8px 10px;background:rgba(10,8,40,.5)}
.tile b{display:block;font:700 22px/1 var(--f-mono);color:#fff}
.tile small{font:500 10.5px var(--f-body);color:var(--muted)}
.arow{display:grid;grid-template-columns:10px 1fr auto;gap:8px;padding:7px 4px;border-bottom:1px solid rgba(41,230,255,.12);cursor:pointer;min-height:44px;align-items:center}
.arow:hover{background:rgba(41,230,255,.07)}
.arow .dot{width:9px;height:9px;border-radius:50%}
.arow .nm{font-weight:600}
.arow .m{font-size:11px;color:var(--muted)}
.st{display:inline-block;border-radius:4px;padding:1px 7px;font:700 10px var(--f-mono);letter-spacing:.04em}
.st.work{background:rgba(45,226,192,.16);color:var(--ok)}
.st.idle{background:rgba(155,148,201,.16);color:var(--muted)}
.st.wait{background:rgba(255,179,71,.16);color:var(--warn)}
.st.bad{background:rgba(255,90,110,.18);color:var(--bad)}
.st.stuck{background:rgba(255,179,71,.08);color:#d9a45a;border:1px dashed rgba(255,179,71,.45)}
.st.off{background:rgba(110,100,160,.2);color:#8b86b3}
.logl{font:11.5px/1.55 var(--f-mono);color:var(--muted)}
.logl div:first-child{color:var(--ink)}
.bar{height:8px;border-radius:2px;background:rgba(41,230,255,.12);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pu),var(--cy))}
.link{color:var(--or);font-weight:600;text-decoration:none}
.empty-note{color:var(--muted);padding:8px 2px}

.topbar{position:absolute;z-index:3;left:248px;right:324px;top:12px;display:flex;gap:10px;align-items:center;pointer-events:none}
.topbar>*{pointer-events:auto}
.crumb{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:4px;background:rgba(14,8,48,.78);border:1px solid rgba(41,230,255,.3);font:700 11px var(--f-mono);letter-spacing:.12em;color:#7ff3ff;text-transform:uppercase}
.btn{min-height:40px;padding:0 14px;border-radius:4px;border:1px solid var(--or);background:rgba(255,179,71,.12);color:var(--or);font:700 11px var(--f-mono);letter-spacing:.1em;cursor:pointer}
.btn:hover{background:rgba(255,179,71,.28)}
.hint{position:absolute;z-index:3;left:248px;bottom:12px;font:500 11px var(--f-mono);color:#8e86c8;background:rgba(14,8,48,.6);padding:4px 10px;border-radius:999px;pointer-events:none}
.toolbar{display:none}
.brand{padding:12px 14px 14px;flex:none}
.brand .logo{font:800 32px/1 var(--f-display);letter-spacing:.06em;color:#fff;text-shadow:0 0 18px rgba(120,160,255,.55)}
.brand .logo b{background:linear-gradient(90deg,#aef6ff,#2aa8ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 8px rgba(41,230,255,.6))}
.brand .slogan{margin-top:7px;font:600 9px var(--f-mono);letter-spacing:.2em;color:#9fb4ff}
.brand .tag{margin-top:9px;font:500 12px/1.4 var(--f-body);color:#d6dcff}
.kvwrap{display:grid;grid-template-columns:1fr 112px;gap:8px;align-items:center}
.kv div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted rgba(41,230,255,.22);padding:3px 0;font:600 11.5px var(--f-mono)}
.kv span{color:var(--muted)}.kv b{color:#fff}
.bp{width:100%;height:auto;filter:drop-shadow(0 0 6px rgba(41,230,255,.35))}
.bp rect{cursor:pointer}
.fimg{width:100%;height:auto;display:block;border-radius:4px;border:1px solid rgba(41,230,255,.4);box-shadow:0 0 14px rgba(41,230,255,.25)}
.ov .fimg{max-height:46vh;object-fit:contain;background:#05031a}

/* ---- phóng to ô thông tin ---- */
.ov{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(4,2,18,.66);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .22s}
.ov.on{opacity:1;pointer-events:auto}
.ov .panel{width:min(880px,92%);max-height:88%;display:flex;flex-direction:column;transform:scale(.9);transition:transform .22s cubic-bezier(.2,.9,.3,1.2)}
.ov.on .panel{transform:scale(1)}
.ov .pb{overflow:auto;font-size:13.5px}
.ov .arow{min-height:52px}
.tasks{margin:4px 0 0;padding-left:16px;color:var(--muted);font-size:12px}

@media (max-width:900px){
  .dock-r,.dock-l .fl-list,.dock-l .brand,.hint{display:none}
  .dock-l{width:auto;bottom:auto;right:12px;flex-direction:row;align-items:center}
  .dock-l .panel{flex:1}
  .topbar{left:12px;right:12px;top:auto;bottom:62px}
  .toolbar{display:flex;gap:8px;position:absolute;z-index:3;left:12px;right:12px;bottom:12px}
  .toolbar .btn{flex:1}
  .stage{min-height:520px}
}
button:focus-visible,.fl:focus-visible,.arow:focus-visible,.ph:focus-visible{outline:2px solid var(--or);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

/* ---------- WebGL có chạy được không? Không thì dùng bản 2D ---------- */
const glHost=document.getElementById('gl');
let renderer;
try{ renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'}); }
catch(e){ location.replace('/tnt-office-live.html'); throw e; }
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;
glHost.appendChild(renderer.domElement);

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const PAL=['#29e6ff','#ff7ad9','#4fe0b0','#b59cff','#ffc65c','#ff9f6b','#6be3ff','#c3e66b','#7aa7ff','#ff8a8a'];
const EXEC_COLOR='#ffb347';
const POLL_MS=10000;
const STATE_HEX={work:0x2de2c0,wait:0xffb347,bad:0xff5a6e,stuck:0xd9a45a,idle:0x7aa7ff,off:0x8b86b3};
const FH=3.4, FW=13, FD=9; // chiều cao một tầng, rộng, sâu

/* ---------- Tiện ích ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const hmsNow=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())};
const hmNow=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
function ago(iso){
  if(!iso)return '—';
  const m=Math.round((Date.now()-new Date(iso).getTime())/60000);
  if(m<1)return 'vừa xong';
  if(m<60)return m+' phút trước';
  const h=Math.floor(m/60);
  if(h<24)return h+' giờ trước';
  return Math.floor(h/24)+' ngày trước';
}
const shortName=n=>{const s=String(n||'');return s.length>16?s.slice(0,15)+'…':s};
const hex6=n=>'#'+n.toString(16).padStart(6,'0');
const GL=(c,k=1.6)=>new THREE.Color(c).multiplyScalar(k); // màu quá sáng để hiệu ứng bloom bắt được

/* ---------- Trạng thái ---------- */
function viewState(a){
  switch(a.status){
    case 'running': return a.stuck_running?'stuck':'work';
    case 'approval_required': return 'wait';
    case 'error': case 'warning': return 'bad';
    case 'offline': return 'off';
    default: return 'idle';
  }
}
const LABEL={stuck:'CÓ THỂ KẸT',work:'ĐANG LÀM',wait:'CHỜ DUYỆT',bad:'LỖI',off:'OFFLINE',idle:'RẢNH'};
const ORDER={work:0,wait:1,bad:2,stuck:3,idle:4,off:5};

/* ---------- Cảnh ---------- */
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(30,1,.5,600);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.08;
controls.minPolarAngle=.35;controls.maxPolarAngle=1.5;
controls.screenSpacePanning=true;controls.minDistance=7;controls.maxDistance=260;

scene.fog=new THREE.FogExp2(0x1b1450,.0042);
scene.add(new THREE.HemisphereLight(0x9a86ff,0x1a1040,.95));
scene.add(new THREE.AmbientLight(0x6a5cff,.3));
const sun=new THREE.DirectionalLight(0xd5eaff,1.15);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0004;sun.shadow.normalBias=.04;
sun.position.set(30,60,38);scene.add(sun);scene.add(sun.target);
{const sc=sun.shadow.camera;sc.left=-30;sc.right=30;sc.top=34;sc.bottom=-8;sc.near=1;sc.far=140;sc.updateProjectionMatrix()}
const cyanLight=new THREE.PointLight(0x29e6ff,40,60);cyanLight.position.set(-14,4,16);scene.add(cyanLight);
const purpleLight=new THREE.PointLight(0x8b5cff,60,80);purpleLight.position.set(14,10,-14);scene.add(purpleLight);

// bầu trời hoàng hôn + môi trường phản chiếu cho kính, sàn, mặt nước
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,
  vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'varying vec3 vP;void main(){float h=normalize(vP).y;vec3 top=vec3(.02,.04,.18),mid=vec3(.10,.08,.36),hor=vec3(.78,.36,.55),glow=vec3(1.,.6,.4);vec3 c=mix(mid,top,smoothstep(.12,.85,h));c=mix(hor,c,smoothstep(0.,.3,h));c+=glow*exp(-abs(h)*16.)*.4;c=mix(c,vec3(.02,.02,.10),smoothstep(0.,-.25,h));gl_FragColor=vec4(c,1.);\n#include <tonemapping_fragment>\n#include <colorspace_fragment>\n}'});
const sky=new THREE.Mesh(new THREE.SphereGeometry(450,32,16),skyMat);sky.renderOrder=-10;scene.add(sky);
{
  const envScene=new THREE.Scene();envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50,32,16),skyMat));
  const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(envScene,.02).texture;scene.environmentIntensity=.7;pm.dispose();
}

const norm=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
function planFloors(){
  const taken={},unmatched=[];
  const exec=agents.filter(a=>!a.department_id);
  if(exec.length)taken[10]={agents:exec,matched:true};
  (data.departments||[]).forEach(d=>{
    const list=agents.filter(a=>a.department_id===d.id);if(!list.length)return;
    const nn=norm(d.name);let n=null;
    for(let k=10;k>=1;k--){if(taken[k])continue;if(FLOOR_PLAN[k].keys.some(w=>nn.includes(w))){n=k;break}}
    if(n)taken[n]={agents:list,matched:true};else unmatched.push({d,list});
  });
  // phòng ban chưa khớp kế hoạch → tầng còn trống từ 9 xuống 1, giữ tên riêng, không gắn ảnh/mô tả của tầng khác
  for(const u of unmatched){let n=null;for(let k=9;k>=1;k--){if(!taken[k]){n=k;break}}
    if(n)taken[n]={agents:u.list,matched:false,name:String(u.d.name).toUpperCase()};else console.warn('Không còn tầng cho phòng ban',u.d.name)}
  TOTAL=10;
  const fl=[];
  for(let n=1;n<=10;n++){
    const p=FLOOR_PLAN[n],t=taken[n],own=t&&!t.matched;
    fl.push({n,name:own?t.name:p.name,desc:own?'':p.desc,img:own?null:('/tower/floors/f'+n+'.jpg'),color:p.color,agents:t?t.agents:[],type:t?'dept':(n===1?'lobby':'plan')});
  }
  return fl;
}

const SPH=(target,dist,polar,az)=>new THREE.Vector3(target.x+dist*Math.sin(polar)*Math.sin(az),target.y+dist*Math.cos(polar),target.z+dist*Math.sin(polar)*Math.cos(az));

function distFor(halfH,halfW){
  const fov=camera.fov*Math.PI/180,t=Math.tan(fov/2);
  return Math.max(halfH/t,halfW/(t*camera.aspect));
}
function cameraGoal(){
  if(view.floor===null){
    const H=TOTAL*FH;
    const target=new THREE.Vector3(0,H*.46,0);
    return {target,pos:SPH(target,distFor(H*.72,FW*1.5),1.28,.62)};
  }
  const y0=(view.floor-1)*FH,target=new THREE.Vector3(0,y0+.7,.5);

}

const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let downXY=null;
renderer.domElement.addEventListener('pointerdown',e=>{downXY=[e.clientX,e.clientY]});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downXY||Math.hypot(e.clientX-downXY[0],e.clientY-downXY[1])>4)return;
  const r=renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  if(view.floor!==null){
    const ah=ray.intersectObjects(hitMeshes.filter(h=>h.parent.parent.visible),false)[0];
    if(ah){selectAgent(byId.get(ah.object.userData.agentId));return}
  }
  const fh=ray.intersectObjects(floorHits.filter(h=>h.parent.visible),false)[0];
  if(fh)selectFloor(fh.object.userData.floor);
});

function applyStates(){
  for(const a of agents){
    if(!a.parts)continue;
    const st=viewState(a),hex=STATE_HEX[st],p=a.parts;
    p.ledMat.emissive.setHex(hex);p.ledMat.emissiveIntensity=st==='off'?.2:1.8;
    p.ringMat.color.setHex(hex);p.glowMat.color.setHex(hex);
    const lit=st==='work'||st==='wait'||st==='bad';
    p.screenMat.emissive.setHex(st==='work'?0x2de2c0:st==='wait'?0xffb347:st==='bad'?0xff5a6e:st==='off'?0x000000:0x2a4a7a);
    p.screenMat.emissiveIntensity=st==='work'?1.1:lit?.9:st==='off'?0:.5;

  }
  for(const l of agentLabels){

    bb.className='bb '+st;bb.textContent=st==='idle'?'':(st==='stuck'?'KẸT?':LABEL[st]);

  }

    const dots=(c.work?`<span class="ok">●${c.work}</span>`:'')+(c.wait?`<span class="wr">◆${c.wait}</span>`:'')+(c.bad?`<span class="bd">▲${c.bad}</span>`:'')+(c.stuck?`<span class="sk">?${c.stuck}</span>`:'');
    l.el.innerHTML=`<b>T${f.n}</b> ${esc(f.name.length>16?f.name.slice(0,15)+'…':f.name)} <span class="dots">${dots}</span>`;
    l.el.classList.toggle('sel',view.floor===f.n);l.el.classList.toggle('empty',f.type==='plan');l.el.classList.toggle('dim',view.floor!==null&&view.floor!==f.n);
  }
}

/* ---------- Vòng lặp vẽ ---------- */
const t0=performance.now(),tmp=new THREE.Vector3();
function frame(){
  requestAnimationFrame(frame);
  if(!tower)return;
  const t=(performance.now()-t0)/1000;
  if(goal){
    camera.position.lerp(goal.pos,.075);controls.target.lerp(goal.target,.075);
    if(camera.position.distanceTo(goal.pos)<.05&&controls.target.distanceTo(goal.target)<.05)goal=null;
  }
  for(const r of rings)if(!reduce)r.rotation.z+=r.userData.spin*.01;
  for(const f of fountains){for(let q=0;q<f.seeds.length;q++){const sd=f.seeds[q],u=(t*.55+sd.ph)%1;f.pos[q*3]=f.cx+sd.dx*u*1.4;f.pos[q*3+1]=.2+4*u*(1-u)*f.h;f.pos[q*3+2]=f.cz+sd.dz*u*1.4}f.pts.geometry.attributes.position.needsUpdate=true}
  for(const o of vehicles){const a=t*o.sp+o.ph;o.v.position.set(Math.cos(a)*o.r*1.15,o.h+Math.sin(t*.6+o.ph)*.8,Math.sin(a)*o.r);o.v.rotation.y=-a-Math.PI/2-(o.sp>0?0:Math.PI)}
  if(window.__stars&&!reduce)window.__stars.rotation.y=t*.004;
  if(beacon){const k=.5+.5*Math.sin(t*3);beacon.scale.setScalar(.16+.1*k);beacon.userData.halo.material.opacity=.4+.5*k}
  for(const a of agents){
    const p=a.parts;if(!p||!p.floor.group.visible)continue;
    const st=viewState(a),u=p.fig.userData;
    if(st==='work'&&!reduce){
      u.arms[0].rotation.x=.42+Math.sin(t*14+p.phase)*.09;u.arms[1].rotation.x=.42+Math.sin(t*14+p.phase+1.7)*.09;
      u.head.rotation.x=.12+Math.sin(t*2+p.phase)*.04;u.head.rotation.y=0;
      p.ringMat.opacity=.5+.3*Math.sin(t*3+p.phase);
    }else{
      u.arms[0].rotation.x=u.arms[1].rotation.x=.25;u.head.rotation.x=0;
      u.head.rotation.y=reduce?0:Math.sin(t*.6+p.phase)*.35;
      p.ringMat.opacity=st==='bad'?(.3+.4*(Math.sin(t*6)>0?1:0)):st==='wait'?.55+.25*Math.sin(t*2.5):st==='off'?.12:.32;
    }
    if(selected===a)p.ringMat.opacity=.95;
  }
  for(const w of walkers){
    const [x0,x1]=w.userData.span,L=x1-x0,s=((t+w.userData.t0)*w.userData.speed)%(2*L),x=s<L?x0+s:x1-(s-L);
    w.position.set(x,0,w.userData.z);w.rotation.y=s<L?-Math.PI/2:Math.PI/2;
    const sw=Math.sin(t*6+w.userData.t0)*.5;w.userData.legs[0].rotation.x=sw;w.userData.legs[1].rotation.x=-sw;
    w.userData.arms[0].rotation.x=-sw*.6;w.userData.arms[1].rotation.x=sw*.6;
  }
  controls.update();
  if(fxOn&&composer)composer.render();else renderer.render(scene,camera);
  // máy yếu thì tự tắt hiệu ứng phát sáng
  if(!fxLocked&&fxOn){const now=performance.now();if(lastT){fpsAcc+=now-lastT;fpsN++;if(fpsN>=90){if(fpsAcc/fpsN>48){if(++perfStrike>=2)setFx(false,true)}else perfStrike=0;fpsAcc=0;fpsN=0}}lastT=now}else lastT=0;
  // nhãn HTML bám theo vị trí 3D
  const W=glHost.clientWidth,H=glHost.clientHeight;
  const place=(el,pos,show)=>{
    if(!show){el.style.display='none';return}
    tmp.copy(pos).project(camera);
    if(tmp.z>1){el.style.display='none';return}
    el.style.display='';
    el.style.transform=`translate(${((tmp.x*.5+.5)*W).toFixed(1)}px,${((-tmp.y*.5+.5)*H).toFixed(1)}px) translate(-50%,-100%)`;
  };
  for(const l of floorLabels)place(l.el,l.pos,view.floor===null||l.floor.n<=view.floor);
  for(const l of agentLabels)place(l.el,l.pos,view.floor===l.floor);
}

  if(id==='floor'){
    if(view.floor===null){
      const rows=floors.filter(f=>f.type==='dept').slice().reverse().map(f=>{const c=floorStats(f);return `<div class="arow" data-floor="${f.n}" tabindex="0" style="grid-template-columns:36px 1fr auto"><b style="font:700 13px var(--f-mono);color:${f.color}">T${f.n}</b><div><div class="nm">${esc(f.name)}</div><div class="m">${f.agents.length} nhân sự</div></div><span class="m">${c.work?`<span class="ok">●${c.work}</span> `:''}${c.wait?`<span class="wr">◆${c.wait}</span> `:''}${c.bad?`<span class="bd">▲${c.bad}</span>`:''}</span></div>`}).join('');
      return (expanded?'':'<div class="m" style="color:var(--muted);margin-bottom:4px">Bấm một tầng để vào xem</div>')+(rows||'<div class="empty-note">Chưa có tầng nào có nhân sự.</div>');
    }
    const f=floors[view.floor-1];
    return `<div style="font:700 11px var(--f-mono);color:${f.color};letter-spacing:.1em;margin-bottom:4px">T${f.n} · ${esc(f.name)}</div>`+(f.agents.length?agentRows(f.agents,expanded):'<div class="empty-note">Tầng này chưa có nhân sự.</div>');
  }
  if(id==='approvals'){
    const pend=data?.pending_approvals||0;
    const list=(data?.recent_tasks||[]).filter(t=>t.status==='approval_required');
    let h=`<div class="tiles" style="grid-template-columns:1fr"><div class="tile"><b class="wr">${pend}</b><small>việc đang chờ bạn duyệt</small></div></div>`;
    if(list.length)h+=list.slice(0,expanded?20:3).map(t=>{const a=byId.get(t.agent_id);return `<div class="arow" tabindex="0" data-agent="${esc(t.agent_id)}"><span class="dot" style="background:var(--warn)"></span><div><div class="nm">${esc(a?a.name:'Agent')}</div><div class="m">${esc(t.input||'(không có nội dung)')}</div></div><span style="color:var(--or)">›</span></div>`}).join('');
    h+=`<div style="margin-top:10px"><a class="link" href="/dashboard" target="_top">Mở mục Chờ duyệt để duyệt →</a></div>`;
    return h;
  }
  if(id==='log')return `<div class="logl">${(logs.length?logs:['Chưa có sự kiện.']).slice(0,expanded?40:6).map(l=>`<div>${esc(l)}</div>`).join('')}</div>`;
  return '';
}
function blueprint(){
  const top=22,fh=11,H=top+TOTAL*fh+18;
  let q=`<svg class="bp" viewBox="0 0 120 ${H}" role="img" aria-label="Sơ đồ các tầng"><line x1="60" y1="2" x2="60" y2="${top}" stroke="#7ff3ff" stroke-width="1"/><ellipse cx="60" cy="${H-8}" rx="54" ry="6" fill="none" stroke="#8b5cff" stroke-opacity=".7"/>`;
  floors.slice().reverse().forEach((f,i)=>{
    const k=(f.n-1)/Math.max(1,TOTAL-1),w=74-k*16,x=60-w/2,y=top+i*fh,c=floorStats(f);
    let fill='#6b6499',op=.18;
    if(f.type==='lobby'){fill='#29e6ff';op=.25}
    else if(f.type==='dept'){fill=c.bad?'#ff5a6e':c.wait?'#ffb347':c.work?'#2de2c0':'#7aa7ff';op=.35+.45*(f.agents.length?c.work/f.agents.length:0)}
    const sel=view.floor===f.n;
    q+=`<rect data-floor="${f.n}" x="${x.toFixed(1)}" y="${y}" width="${w.toFixed(1)}" height="${fh-1.5}" rx="1.5" fill="${fill}" fill-opacity="${op.toFixed(2)}" stroke="${sel?'#ffb347':'#29e6ff'}" stroke-opacity="${sel?1:.55}" stroke-width="${sel?1.6:.7}"/><text x="${(x+w+3).toFixed(1)}" y="${y+7}" font-size="6" fill="#9b94c9" font-family="monospace">${f.n}</text>`;
  });
  return q+'</svg>';
}
const TITLES={info:'Thông tin tầng',overview:'Tổng quan',floor:'Nhân sự',approvals:'Chờ duyệt',log:'Nhật ký'};
let overlay=null; // {id, agentId}
function agentDetail(a){
  const st=viewState(a),ts=(tasksByAgent.get(a.id)||[]).slice(0,5);
  return `<div style="font:700 16px var(--f-display);color:${a.color||'#fff'}">${esc(a.name)}</div><div class="m" style="color:var(--muted)">${esc(a.role||'')}</div>
  <div style="margin:10px 0">${statusChip(a)}</div>
  <div class="tiles"><div class="tile"><b style="font-size:15px">${esc(a.level||'—')}</b><small>cấp</small></div><div class="tile"><b style="font-size:15px">${a.approval_level?('Cấp '+a.approval_level):'Tự chạy'}</b><small>cần duyệt</small></div><div class="tile" style="grid-column:1/3"><b style="font-size:15px">${esc(ago(a.last_task_completed_at))}</b><small>xong việc gần nhất</small></div></div>
  <div style="margin-top:12px;font:700 11px var(--f-mono);letter-spacing:.12em;color:#7ff3ff">VIỆC GẦN ĐÂY</div>`+
  (ts.length?`<ul class="tasks" style="font-size:13px">${ts.map(t=>`<li>${esc(t.input||'(không có nội dung)')} · ${esc(t.status)}${t.delegated?' · được giao lại':''}</li>`).join('')}</ul>`:'<div class="empty-note">Chưa có việc gần đây.</div>');
}
function renderOverlay(){
  if(!overlay)return;
  const a=overlay.id==='agent'?byId.get(overlay.agentId):null;
  $('ov-t').textContent=overlay.id==='agent'?'HỒ SƠ NHÂN SỰ':TITLES[overlay.id].toUpperCase();
  $('ov-b').innerHTML=overlay.id==='agent'?(a?agentDetail(a):'<div class="empty-note">Không còn dữ liệu.</div>'):panelHTML(overlay.id,true);
}
function openOverlay(id,agentId){overlay={id,agentId};renderOverlay();$('ov').classList.add('on')}
function closeOverlay(){overlay=null;$('ov').classList.remove('on')}
$('ov').addEventListener('click',e=>{if(e.target===$('ov'))closeOverlay()});
$('ov-h').addEventListener('click',closeOverlay);
document.querySelectorAll('#dockR .panel .ph').forEach(h=>{
  const open=()=>openOverlay(h.parentElement.dataset.p);
  h.addEventListener('click',open);h.addEventListener('keydown',e=>{if(e.key==='Enter')open()});
});
document.querySelectorAll('#toolbar [data-open]').forEach(b=>b.addEventListener('click',()=>openOverlay(b.dataset.open)));
function wireRows(root){
  root.addEventListener('click',e=>{
    const r=e.target.closest('[data-agent],[data-floor]');if(!r)return;
    if(r.dataset.agent){const a=byId.get(r.dataset.agent);if(a){closeOverlay();selectAgent(a)}}
    else{closeOverlay();selectFloor(Number(r.dataset.floor))}
  });
  root.addEventListener('keydown',e=>{if(e.key==='Enter'){const r=e.target.closest('[data-agent],[data-floor]');if(r)r.click()}});
}
wireRows($('dockR'));wireRows($('ov'));

function renderFloorList(){
  $('fl').innerHTML=floors.slice().reverse().map(f=>{
    const c=floorStats(f);
    const s=(c.work?`<span class="ok">●${c.work}</span>`:'')+(c.wait?`<span class="wr">◆${c.wait}</span>`:'')+(c.bad?`<span class="bd">▲${c.bad}</span>`:'');
    return `<div class="fl${view.floor===f.n?' sel':''}${f.type==='plan'?' empty':''}" tabindex="0" data-fl="${f.n}" style="--c:${f.color}"><span class="n">${f.n}</span><span class="t">${esc(f.name)}</span><span class="s">${s}</span></div>`}).join('');
}
$('fl').addEventListener('click',e=>{const r=e.target.closest('[data-fl]');if(r)selectFloor(Number(r.dataset.fl))});
$('fl').addEventListener('keydown',e=>{if(e.key==='Enter'){const r=e.target.closest('[data-fl]');if(r)selectFloor(Number(r.dataset.fl))}});

function refreshUI(){
  if(!data)return;
  applyStates();renderFloorList();
  for(const id of ['overview','info','floor','approvals','log'])$('p-'+id).innerHTML=panelHTML(id,false);
  $('pn-info').hidden=view.floor===null;$('tb-info').hidden=view.floor===null;
  $('p-info-t').textContent=view.floor===null?'Thông tin tầng':('Tầng '+view.floor);
  $('p-floor-t').textContent=view.floor===null?'Các tầng':('Tầng '+view.floor);
  renderOverlay();
}

/* ---------- Lấy dữ liệu ---------- */
const prevStatus=new Map();let firstLoad=true,layoutKey='';
const badge=$('badge'),badgeText=$('badgeText'),subtitle=$('subtitle');
const setBadge=(k,t)=>{badge.className='badge '+k;badgeText.textContent=t};
function apply(json){
  data=json;
  const old=new Map(agents.map(a=>[a.id,a]));
  agents=(json.agents||[]).map(a=>Object.assign(old.get(a.id)||{},a));
  byId=new Map(agents.map(a=>[a.id,a]));
  const key=agents.map(a=>a.id+':'+a.department_id).join('|')+'#'+(json.departments||[]).map(d=>d.id).join('|');
  if(key!==layoutKey){floors=[];buildTower();layoutKey=key}
  tasksByAgent=new Map();
  for(const t of json.recent_tasks||[]){if(!tasksByAgent.has(t.agent_id))tasksByAgent.set(t.agent_id,[]);tasksByAgent.get(t.agent_id).push(t)}
  for(const a of agents){
    const p=prevStatus.get(a.id);
    if(!firstLoad&&p!==undefined&&p!==a.status){
      const s=viewState(a);
      log(`${hmNow()} · ${shortName(a.name)}: ${s==='work'?'bắt đầu xử lý việc':s==='wait'?'đang chờ duyệt':s==='bad'?'gặp lỗi':p==='running'?'xong việc':'đổi trạng thái → '+a.status}`);
    }
    prevStatus.set(a.id,a.status);
  }
  if(firstLoad)log(`${hmNow()} · Đã kết nối, ${agents.length} nhân sự AI`);
  firstLoad=false;
  subtitle.textContent=`${json.business_unit?.name||''} · dữ liệu thật từ hệ thống`;
  setBadge('live','TRỰC TIẾP · '+hmsNow());
  if(selected)selected=byId.get(selected.id)||null;
  refreshUI();
}
async function poll(){
  if(document.hidden)return;
  try{
    const res=await fetch('/api/office/state',{credentials:'same-origin',cache:'no-store'});
    if(res.status===401){setBadge('err','CẦN ĐĂNG NHẬP');subtitle.innerHTML='Phiên đăng nhập đã hết. <a href="/login" target="_top" style="color:var(--or)">Đăng nhập lại</a>';return}
    const json=await res.json().catch(()=>null);
    if(!res.ok||!json){setBadge('err','LỖI DỮ LIỆU');subtitle.textContent=(json&&json.error)||('Không lấy được dữ liệu (HTTP '+res.status+').');return}
    apply(json);
  }catch(e){setBadge('err','MẤT KẾT NỐI');if(!data)subtitle.textContent='Không kết nối được tới hệ thống. Thử tải lại trang.'}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
resize();poll();setInterval(poll,POLL_MS);requestAnimationFrame(frame);
window.__tower={scene,camera,controls,selectFloor,selectAgent,get floors(){return floors},get agents(){return agents}};
</script>
