name: Deploy to Vercel

# Vercel's own GitHub webhook integration has been unreliable — pushes to
# main sometimes stop triggering Vercel deployments with no visible error.
# This workflow deploys directly via the Vercel CLI instead, so a push to
# main always produces a production deployment regardless of whether
# Vercel's webhook is behaving.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Not secret — just identifiers (Project Settings -> General / account
# General page). Setting these directly lets `vercel pull` skip the
# "Loading teams..." account-lookup call that a project-scoped token
# can't make, which was failing with "Error: User not found."
env:
  VERCEL_ORG_ID: team_7n5WO2OVzPgc8QZbe1wL7lQj
  VERCEL_PROJECT_ID: prj_XwQNzaM7lFnSA1w3pTtR5qFbkFyK

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
