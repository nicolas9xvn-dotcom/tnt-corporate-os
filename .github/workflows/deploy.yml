name: Deploy to Vercel

# Vercel's own GitHub webhook integration has been unreliable — pushes to
# main sometimes stop triggering Vercel deployments with no visible error.
# Restored (2026-09-13): Netlify's free-tier build credits ran out for this
# billing cycle, pausing production deploys there too, so this CLI-based
# path is the only way to get main's latest commits live on Vercel while
# that's the case. This workflow deploys directly via the Vercel CLI, so a
# push to main always produces a production deployment regardless of
# whether Vercel's webhook is behaving.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Not secret — just identifiers (Project Settings -> General / account
# General page). Setting these directly lets `vercel pull` skip the
# "Loading teams..." account-lookup call that a project-scoped token
# can't make, which was failing with "Error: User not found."
env:
  VERCEL_ORG_ID: team_7n5WO2OVzPgc8QZbe1wL7lQj
  VERCEL_PROJECT_ID: prj_XwQNzaM7lFnSA1w3pTtR5qFbkFyK

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Debug - list teams/projects this token can see
        run: |
          echo "--- vercel whoami ---"
          vercel whoami --token="$VERCEL_TOKEN" || true
          echo "--- vercel teams ls ---"
          vercel teams ls --token="$VERCEL_TOKEN" || true
          echo "--- vercel project ls (no org id set) ---"
          vercel project ls --token="$VERCEL_TOKEN" || true
        env:
          # Blank out the job-level org/project id for just this step, so
          # these calls show what the token can ACTUALLY see, not what it
          # can see filtered through an org id that might be the wrong one.
          VERCEL_ORG_ID: ""
          VERCEL_PROJECT_ID: ""
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
